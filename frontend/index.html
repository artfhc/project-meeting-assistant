<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy:
        - default-src 'self'              — no inline scripts/styles except what Vite injects
        - connect-src 'self' ws:          — allow WebSocket to Python backend on localhost
        - img-src 'self' data:            — allow data URIs for inline images
      Tighten further once preload IPC is wired in Phase 3.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:7357 ws://localhost:7357; img-src 'self' data:;"
    />
    <title>Meeting Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="h-full bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased">
    <div id="root" class="h-full"></div>
    <!-- Vite injects the compiled renderer bundle here -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
